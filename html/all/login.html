<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .message { margin-top: 15px; padding: 10px; border-radius: 4px; }
        .error { background-color: #f2dede; color: #a94442; }
        .links { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <h1>Вход</h1>
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" required>
        </div>
        
        <button type="submit">Войти</button>
    </form>
    
    <div class="links">
        <p>Нет аккаунта? <a href="update_index.html">Зарегистрироваться</a></p>
    </div>
    
    <div id="message" class="message"></div>

    <script src="auth.js"></script>
    <script>
        // Проверка авторизации при загрузке
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
                
                // Если пользователь уже авторизован, перенаправляем
                if (localStorage.getItem('authToken')) {
                    window.location.href = 'profile.html';
                }
            } catch (error) {
                showMessage('Ошибка инициализации приложения', 'error');
                console.error('Ошибка инициализации:', error);
            }
        });

        // Обработка формы входа
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Валидация
            if (!email || !password) {
                showMessage('Все поля обязательны для заполнения', 'error');
                return;
            }
            
            try {
                const user = await loginUser(email, password);
                
                // Сохраняем токен авторизации
                localStorage.setItem('authToken', generateAuthToken(user.id));
                
                // Перенаправляем на защищенную страницу
                window.location.href = 'profile.html';
                
            } catch (error) {
                showMessage(error, 'error');
            }
        });

        function showMessage(text, type = 'error') {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }
    </script>
</body>
</html>
